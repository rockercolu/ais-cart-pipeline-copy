name: Pilot regression tests
on:
  push:
    branches: [work/pilot-fixes-sync]
  pull_request:
    paths:
      - 'aiscart/**'
      - 'api/**'
      - 'pilot.js'
      - 'index.html'
      - 'tests/**'
      - 'migrations/**'
      - '.github/workflows/pilot-tests.yml'
jobs:
  pilot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/test_pilot.py
      - run: node tests/test_page_journeys.js
      - run: npm install --no-save --ignore-scripts
      - run: npm run test:pilot:sql
